---
# System-level (root) config: lid/sleep policy and hibernation into a swap
# file. Run by hand with `dotfiles system` (asks for the sudo password); it is
# never part of the plain `dotfiles` sync that sway runs on startup.
- hosts: localhost
  become: true
  # a later failure must not drop notified handlers (initramfs, logind)
  force_handlers: true
  vars_files:
    - local_config.yaml
  vars:
    power: "{{ config.power }}"
    swapfile: "{{ config.power.hibernate.swapfile }}"
    nl: "\n"
    # set when resume= is on the kernel command line through something other
    # than systemd-boot entries; otherwise the boot entries prove it
    cmdline_managed_elsewhere: "{{ config.power.hibernate.cmdline_managed_elsewhere | default(false) }}"
    hibernating_actions: [hibernate, hybrid-sleep, suspend-then-hibernate]
    mkinitcpio_dropin: /etc/mkinitcpio.conf.d/zz-dotfiles-resume.conf
  tasks:
    - name: Create systemd drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logind.conf.d
        - sleep.conf.d

    # swap file

    - name: Read swap file filesystem
      ansible.builtin.command: findmnt -no UUID,FSTYPE -T {{ swapfile | dirname }}
      register: swap_fs
      changed_when: false

    - name: Refuse Btrfs (filefrag offsets are wrong there)
      ansible.builtin.assert:
        that: swap_fs.stdout.split()[1] != "btrfs"
        fail_msg: "{{ swapfile }} is on Btrfs; resume_offset needs btrfs inspect-internal, not supported here"

    - name: Check swap file
      ansible.builtin.stat:
        path: "{{ swapfile }}"
      register: swapfile_stat

    - name: Create swap file
      ansible.builtin.command: mkswap -U clear --size {{ power.hibernate.swapfile_size }} --file {{ swapfile }}
      when: not swapfile_stat.stat.exists

    - name: Swap file in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^{{ swapfile | regex_escape }}\s'
        line: "{{ swapfile }} none swap defaults 0 0"

    - name: Read active swaps
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false

    - name: Enable swap file
      ansible.builtin.command: swapon {{ swapfile }}
      when: swapfile not in active_swaps.stdout_lines

    - name: Read swap file physical offset
      ansible.builtin.shell: filefrag -v {{ swapfile }} | awk '$1=="0:" {print substr($4, 1, length($4)-2)}'
      register: swap_offset
      changed_when: false

    - name: Build resume kernel parameters
      ansible.builtin.set_fact:
        resume_args:
          - "resume=UUID={{ swap_fs.stdout.split()[0] }}"
          - "resume_offset={{ swap_offset.stdout | trim }}"

    # initramfs

    # HOOKS can span lines or be overridden in mkinitcpio.conf.d, so ask bash
    # for the effective array (excluding our own drop-in).
    - name: Read effective mkinitcpio HOOKS
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - |
            . /etc/mkinitcpio.conf
            for f in /etc/mkinitcpio.conf.d/*.conf; do
                [ -e "$f" ] && [ "$f" != "$1" ] && . "$f"
            done
            echo "${HOOKS[*]}"
          - bash
          - "{{ mkinitcpio_dropin }}"
      register: mkinitcpio_hooks
      changed_when: false

    - name: Create mkinitcpio drop-in directory
      ansible.builtin.file:
        path: /etc/mkinitcpio.conf.d
        state: directory
        mode: "0755"

    # busybox initramfs only; the systemd hook resumes by itself. Appended at
    # the end, after encrypt; root is mounted only after all hooks have run.
    - name: Add the resume hook
      ansible.builtin.copy:
        dest: "{{ mkinitcpio_dropin }}"
        content: "# Managed by dotfiles (system.yaml).{{ nl }}HOOKS+=(resume){{ nl }}"
        mode: "0644"
      when: "'systemd' not in mkinitcpio_hooks.stdout.split() and 'resume' not in mkinitcpio_hooks.stdout.split()"
      notify: Rebuild initramfs

    - name: Remove the resume hook drop-in where it isn't needed
      ansible.builtin.file:
        path: "{{ mkinitcpio_dropin }}"
        state: absent
      when: "'systemd' in mkinitcpio_hooks.stdout.split() or 'resume' in mkinitcpio_hooks.stdout.split()"
      notify: Rebuild initramfs

    # Catches a rebuild lost to an earlier failed run: the drop-in is then
    # unchanged, so nothing above notifies.
    - name: Check the resume hook drop-in
      ansible.builtin.stat:
        path: "{{ mkinitcpio_dropin }}"
      register: dropin_stat

    - name: Find initramfs images
      ansible.builtin.find:
        paths: /boot
        patterns: "initramfs-*.img"
      register: initramfs_images

    - name: Initramfs is older than the resume hook drop-in
      ansible.builtin.debug:
        msg: rebuilding initramfs
      changed_when: true
      when: >-
        dropin_stat.stat.exists and initramfs_images.files | length > 0
        and (initramfs_images.files | map(attribute='mtime') | min) < dropin_stat.stat.mtime
      notify: Rebuild initramfs

    # kernel command line (systemd-boot)

    - name: Locate boot loader entries
      ansible.builtin.command: bootctl --print-boot-path
      register: boot_path
      changed_when: false
      failed_when: false

    - name: Find boot loader entries
      ansible.builtin.find:
        paths: "{{ boot_path.stdout }}/loader/entries"
        patterns: "*.conf"
      register: boot_entries
      when: boot_path.rc == 0

    - name: Read boot loader entries
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ boot_entries.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: boot_entry_contents

    # Not copy's backup: its timestamped name has ":", which the FAT ESP
    # rejects. The name doesn't end in .conf, so systemd-boot ignores it.
    - name: Keep each boot loader entry as first seen
      ansible.builtin.copy:
        remote_src: true
        src: "{{ item.source }}"
        dest: "{{ item.source }}.dotfiles-orig"
        force: false
      loop: "{{ boot_entry_contents.results }}"
      loop_control:
        label: "{{ item.source }}"

    # systemd-boot joins every options line; strip resume args from all of
    # them and append ours to the last one.
    - name: Set resume= and resume_offset= in boot loader entries
      ansible.builtin.copy:
        dest: "{{ item.source }}"
        content: |-
          {%- set lines = (item.content | b64decode).splitlines() -%}
          {%- set ns = namespace(last=-1, opt=0, out=[]) -%}
          {%- for l in lines if l.split()[:1] == ['options'] -%}
          {%- set ns.last = loop.index0 -%}
          {%- endfor -%}
          {%- for l in lines -%}
          {%- if l.split()[:1] == ['options'] -%}
          {%- set opts = l.split()[1:] | reject('match', 'resume(_offset)?=') | list -%}
          {%- if ns.opt == ns.last -%}{%- set opts = opts + resume_args -%}{%- endif -%}
          {%- set ns.opt = ns.opt + 1 -%}
          {%- if opts -%}{%- set ns.out = ns.out + [(['options'] + opts) | join(' ')] -%}{%- endif -%}
          {%- else -%}
          {%- set ns.out = ns.out + [l] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.out | join(nl) }}{{ nl }}
      loop: "{{ boot_entry_contents.results }}"
      loop_control:
        label: "{{ item.source }}"
      when: item.content | b64decode is search('(?m)^options[ \t]')
      register: boot_entry_updates

    # battery and wakeups

    - name: Check UPower config
      ansible.builtin.stat:
        path: /etc/UPower/UPower.conf
      register: upower_conf

    - name: Critical battery action
      ansible.builtin.lineinfile:
        path: /etc/UPower/UPower.conf
        regexp: '^CriticalPowerAction='
        line: "CriticalPowerAction={{ power.critical_battery_action }}"
      when: upower_conf.stat.exists
      notify: Restart upower

    # USB devices (mice, the dock and its hubs) can't wake the machine from
    # suspend; the power button, lid and built-in keyboard still can. Also on
    # bind: usbhid enables wakeup for keyboards while binding, after "add".
    # Charging over the dock is USB-PD, unaffected.
    - name: USB wakeup policy
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/90-dotfiles-usb-wakeup.rules
        content: |
          # Managed by dotfiles (system.yaml): no wakeup from USB devices.
          ACTION=="add|bind|change", SUBSYSTEM=="usb", DRIVERS=="usb", ATTR{power/wakeup}=="enabled", ATTR{power/wakeup}="disabled"
        mode: "0644"
      when: not power.usb_wakeup | default(false)
      notify: Apply udev rules

    - name: Allow wakeup from USB devices again
      ansible.builtin.file:
        path: /etc/udev/rules.d/90-dotfiles-usb-wakeup.rules
        state: absent
      when: power.usb_wakeup | default(false)
      notify: Apply udev rules

    - name: Log the wakeup source of every resume
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/50-dotfiles-pm-debug.conf
        content: "w /sys/power/pm_debug_messages - - - - 1\n"
        mode: "0644"
      when: power.debug_wakeups
      notify: Apply pm debug tmpfile

    - name: Stop logging wakeup sources
      ansible.builtin.file:
        path: /etc/tmpfiles.d/50-dotfiles-pm-debug.conf
        state: absent
      when: not power.debug_wakeups

    - name: Warn if UPower is missing
      ansible.builtin.debug:
        msg: "UPower isn't installed; nothing hibernates at critical battery."
      when: not upower_conf.stat.exists

    # lid and sleep policy, last: a lid action logind can't carry out does
    # nothing at all, so hibernating actions become suspend until the kernel
    # offers hibernation and resume= is known to be on the kernel command line.
    # The kernel drops "disk" from /sys/power/state under lockdown (often from
    # Secure Boot), nohibernate, memfd_secret use or CXL memory.
    - name: Read kernel sleep states
      ansible.builtin.slurp:
        src: /sys/power/state
      register: power_states

    - name: Decide whether hibernation is set up
      ansible.builtin.set_fact:
        kernel_hibernates: "{{ 'disk' in (power_states.content | b64decode).split() }}"
        cmdline_ready: >-
          {{ cmdline_managed_elsewhere | bool
          or (boot_entry_updates.results | default([]) | rejectattr('skipped', 'defined') | list | length > 0) }}

    - name: Combine hibernation checks
      ansible.builtin.set_fact:
        hibernate_ready: "{{ kernel_hibernates | bool and cmdline_ready | bool }}"

    - name: logind lid policy
      ansible.builtin.template:
        src: templates/logind-lid.conf.j2
        dest: /etc/systemd/logind.conf.d/50-dotfiles-lid.conf
        mode: "0644"
      notify: Reload logind

    - name: Hibernate delay and mode
      ansible.builtin.template:
        src: templates/sleep-hibernate.conf.j2
        dest: /etc/systemd/sleep.conf.d/50-dotfiles-hibernate.conf
        mode: "0644"

    - name: Run pending handlers before a possible failure below
      ansible.builtin.meta: flush_handlers

    - name: The kernel doesn't offer hibernation
      ansible.builtin.fail:
        msg: >-
          Everything else is applied and the lid falls back to plain suspend,
          but /sys/power/state has no "disk": the kernel has hibernation
          switched off (see /sys/kernel/security/lockdown, Secure Boot,
          nohibernate in /proc/cmdline). Run `dotfiles system` again once
          it's fixed.
      when: not kernel_hibernates | bool

    - name: resume= isn't on the kernel command line yet
      ansible.builtin.fail:
        msg: >-
          Everything else is applied and the lid falls back to plain suspend,
          but no systemd-boot entries were updated. Add these to your kernel
          command line by hand, then set config.power.hibernate.cmdline_managed_elsewhere
          and run `dotfiles system` again: {{ resume_args | join(' ') }}
      when: not cmdline_ready | bool

  handlers:
    - name: Apply udev rules
      ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=usb --action=change

    - name: Reload logind
      ansible.builtin.command: systemctl kill -s HUP systemd-logind

    - name: Rebuild initramfs
      ansible.builtin.command: mkinitcpio -P

    - name: Restart upower
      ansible.builtin.systemd_service:
        name: upower
        state: restarted

    - name: Apply pm debug tmpfile
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/50-dotfiles-pm-debug.conf
