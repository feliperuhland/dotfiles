---
- hosts: localhost
  vars_files:
    - local_config.yaml
  tasks:
    - name: Create generated directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/generated"
        state: directory

    - name: HOME symlinks
      ansible.builtin.file:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "~/{{ item }}"
        state: link
      loop:
        - .Xresources
        - .Xresources.d

    - name: Create necessary directories
      ansible.builtin.file:
        path: "~/{{ item }}"
        state: directory
      loop:
        - .vim/swap_files
        - .vim/backup_files
        - .vim/undo_files
        - .config/sway
        - .config/waybar
        - .config/mako
        - .config/fuzzel
        - .config/foot
        - .config/kanshi
        - .local/bin

    - name: Symlink nvim config directory
      ansible.builtin.file:
        src: "{{ playbook_dir }}/nvim"
        dest: "~/.config/nvim"
        state: link
        force: true

    - name: Generate config files into generated/
      template:
        src: "templates/{{ item.src }}.j2"
        dest: "{{ playbook_dir }}/generated/{{ item.name }}"
      loop:
        - { src: "vim-config",     name: "vimrc" }
        - { src: "sway-config",    name: "sway-config" }
        - { src: "waybar-config",  name: "waybar-config" }
        - { src: "waybar-style",   name: "waybar-style.css" }
        - { src: "mako-config",    name: "mako-config" }
        - { src: "zsh-config",     name: "zshrc" }
        - { src: "fuzzel-config",  name: "fuzzel.ini" }
        - { src: "foot-config",    name: "foot.ini" }
        - { src: "kanshi-config",  name: "kanshi-config" }

    - name: Symlink generated configs to HOME
      ansible.builtin.file:
        src: "{{ playbook_dir }}/generated/{{ item.name }}"
        dest: "~/{{ item.dst }}"
        state: link
      loop:
        - { name: "vimrc",            dst: ".vimrc" }
        - { name: "sway-config",      dst: ".config/sway/config" }
        - { name: "waybar-config",    dst: ".config/waybar/config" }
        - { name: "waybar-style.css", dst: ".config/waybar/style.css" }
        - { name: "mako-config",      dst: ".config/mako/config" }
        - { name: "zshrc",            dst: ".zshrc" }
        - { name: "fuzzel.ini",       dst: ".config/fuzzel/fuzzel.ini" }
        - { name: "foot.ini",         dst: ".config/foot/foot.ini" }
        - { name: "kanshi-config",    dst: ".config/kanshi/config" }

    - name: Symlink scripts to ~/.local/bin
      ansible.builtin.file:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "~/.local/bin/{{ item }}"
        state: link
      loop:
        - check-drift
        - weather
        - euro

    - name: Install dotfiles drift-check cron job
      ansible.builtin.cron:
        name: "dotfiles drift check"
        minute: "*/15"
        job: "$HOME/.local/bin/check-drift"

    - name: Reload sway
      ansible.builtin.command: swaymsg reload
      ignore_errors: true
