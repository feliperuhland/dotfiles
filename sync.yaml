---
- hosts: localhost
  vars_files:
    - local_config.yaml
  tasks:
    - name: Create generated directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/generated"
        state: directory

    # vim and URxvt configs were removed from the repo; drop their symlinks,
    # but only while they still point here.
    - name: Check symlinks to removed configs
      ansible.builtin.stat:
        path: "~/{{ item }}"
        follow: false
      loop:
        - .vimrc
        - .Xresources
        - .Xresources.d
      register: removed_links

    - name: Remove symlinks to removed configs
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ removed_links.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.islnk | default(false) and item.stat.lnk_source.startswith(playbook_dir ~ '/')

    - name: Create necessary directories
      ansible.builtin.file:
        path: "~/{{ item }}"
        state: directory
      loop:
        - .config/sway
        - .config/waybar
        - .config/mako
        - .config/fuzzel
        - .config/foot
        - .config/kanshi
        - .config/systemd/user
        - .local/bin

    - name: Check current ~/.config/nvim
      ansible.builtin.stat:
        path: "~/.config/nvim"
      register: nvim_dest

    # Runs unattended at every sway login, so never delete: move a real
    # directory aside instead.
    - name: Move a pre-existing real nvim config directory aside
      ansible.builtin.command:
        argv:
          - mv
          - "{{ ansible_env.HOME }}/.config/nvim"
          - "{{ ansible_env.HOME }}/.config/nvim.pre-dotfiles-{{ now(fmt='%Y-%m-%d-%H%M%S') }}"
      when: nvim_dest.stat.exists and not nvim_dest.stat.islnk

    - name: Symlink nvim config directory
      ansible.builtin.file:
        src: "{{ playbook_dir }}/nvim"
        dest: "~/.config/nvim"
        state: link

    - name: Generate config files into generated/
      template:
        src: "templates/{{ item.src }}.j2"
        dest: "{{ playbook_dir }}/generated/{{ item.name }}"
      loop:
        - { src: "sway-config",    name: "sway-config" }
        - { src: "waybar-config",  name: "waybar-config" }
        - { src: "waybar-style",   name: "waybar-style.css" }
        - { src: "mako-config",    name: "mako-config" }
        - { src: "zsh-config",     name: "zshrc" }
        - { src: "fuzzel-config",  name: "fuzzel.ini" }
        - { src: "foot-config",    name: "foot.ini" }
        - { src: "kanshi-config",  name: "kanshi-config" }

    - name: Symlink generated configs to HOME
      ansible.builtin.file:
        src: "{{ playbook_dir }}/generated/{{ item.name }}"
        dest: "~/{{ item.dst }}"
        state: link
      loop:
        - { name: "sway-config",      dst: ".config/sway/config" }
        - { name: "waybar-config",    dst: ".config/waybar/config" }
        - { name: "waybar-style.css", dst: ".config/waybar/style.css" }
        - { name: "mako-config",      dst: ".config/mako/config" }
        - { name: "zshrc",            dst: ".zshrc" }
        - { name: "fuzzel.ini",       dst: ".config/fuzzel/fuzzel.ini" }
        - { name: "foot.ini",         dst: ".config/foot/foot.ini" }
        - { name: "kanshi-config",    dst: ".config/kanshi/config" }

    # force: replaces a stale plain copy of the script
    - name: Symlink the dotfiles command
      ansible.builtin.file:
        src: "{{ playbook_dir }}/dotfiles"
        dest: "~/.local/bin/dotfiles"
        state: link
        force: true

    - name: Symlink scripts to ~/.local/bin
      ansible.builtin.file:
        src: "{{ playbook_dir }}/scripts/{{ item }}"
        dest: "~/.local/bin/{{ item }}"
        state: link
      loop:
        - check-drift
        - weather
        - euro
        - power-state
        - power-sleep

    # A systemd user timer, not cron: no cron daemon is installed by default.
    - name: Drift-check service
      ansible.builtin.copy:
        dest: "~/.config/systemd/user/dotfiles-drift.service"
        content: |
          [Unit]
          Description=Check dotfiles for drift from templates/local_config.yaml

          [Service]
          Type=oneshot
          ExecStart=%h/.local/bin/check-drift
      register: drift_service

    - name: Drift-check timer
      ansible.builtin.copy:
        dest: "~/.config/systemd/user/dotfiles-drift.timer"
        content: |
          [Unit]
          Description=Check dotfiles for drift every 15 minutes

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=15min

          [Install]
          WantedBy=timers.target
      register: drift_timer

    - name: Enable the drift-check timer
      ansible.builtin.systemd_service:
        name: dotfiles-drift.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: "{{ drift_service.changed or drift_timer.changed }}"

    - name: Check for crontab (earlier versions used a cron job)
      ansible.builtin.stat:
        path: /usr/bin/crontab
      register: crontab_bin

    - name: Remove the old drift-check cron job
      ansible.builtin.cron:
        name: "dotfiles drift check"
        state: absent
      when: crontab_bin.stat.exists

    - name: Reload sway
      ansible.builtin.command: swaymsg reload
      ignore_errors: true
